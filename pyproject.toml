[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sapset"
version = "0.1.0"
description = "Localized 3D editing with personalized adapters on Hunyuan3D-2.1"
readme = "README.md"
requires-python = ">=3.10"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Itan Levin" }]
# Dependencies are pinned in requirements.txt, which environment.yml installs.
dependencies = []

[project.scripts]
sapset-edit = "sapset.edit.cli:main"
sapset-texture = "sapset.texture.cli:main"
sapset-eval = "sapset.eval.cli:main"
sapset-bench = "sapset.eval.bench:main"
sapset-personalize = "sapset.personalize.cli:main"

[tool.setuptools.packages.find]
where = [".", "third_party/hy3dshape"]
include = ["sapset*", "hy3dshape*"]
